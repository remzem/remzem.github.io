<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Characters - Wiki</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Tomorrow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="wiki-topbar">
    <a class="wiki-logo" href="/">WORLDWIKI</a>
    <nav class="wiki-topnav">
      <a href="/">HOME</a>
      <a href="/characters/">CHARACTERS</a>
      <a href="/locations/">LOCATIONS</a>
    </nav>
  </header>

  
    <main class="page-fullbleed">
      <div class="char-page">
  <div class="char-menu">
    <h1 class="char-menu-title">Characters</h1>
    <div class="char-row" id="char-row">
      
        
      
        
          <a class="char-thumb"
             href="/content/characters/jun/"
             data-id="2"
             data-name="Jun"
             data-summary="Would full force punch a hamster"
             data-color="">
            <img src="/img/jun_icon.png" alt="Jun">
          </a>
        
      
        
          <a class="char-thumb"
             href="/content/characters/marty/"
             data-id="3"
             data-name="Martin"
             data-summary="Fertility= 9/10 very tortureable balls."
             data-color="">
            <img src="/img/marty_icon.png" alt="Martin">
          </a>
        
      
    </div>
  </div>

  <div class="char-display" id="char-display">
    <div class="char-display-wedge" id="char-display-wedge"></div>

    
      
    
      
        <img class="char-display-img"
             data-id="2"
             src="/img/jun.png"
             alt="Jun">
      
    
      
        <img class="char-display-img"
             data-id="3"
             src="/img/marty.png"
             alt="Martin">
      
    

    <div class="char-display-info">
      <h2 id="char-display-name">Hover a character</h2>
      <p id="char-display-desc"></p>
    </div>
  </div>
</div>

<script>
  const thumbs = document.querySelectorAll('#char-row .char-thumb');
  const displayImgs = document.querySelectorAll('.char-display-img');
  const nameEl = document.getElementById('char-display-name');
  const descEl = document.getElementById('char-display-desc');
  const wedgeEl = document.getElementById('char-display-wedge');

  function selectCharacter(thumb) {
    const id = thumb.dataset.id;
    displayImgs.forEach(img => img.classList.toggle('active', img.dataset.id === id));
    nameEl.textContent = thumb.dataset.name;
    descEl.textContent = thumb.dataset.summary || '';
    if (thumb.dataset.color) {
      wedgeEl.style.backgroundColor = thumb.dataset.color;
    }
    thumbs.forEach(t => t.classList.remove('active'));
    thumb.classList.add('active');
  }

  thumbs.forEach(thumb => {
    thumb.addEventListener('mouseenter', () => selectCharacter(thumb));
  });

  // Show the first character by default instead of a blank pane.
  if (thumbs[0]) {
    selectCharacter(thumbs[0]);
  }
</script>

    </main>
  

  
</body>
</html>
